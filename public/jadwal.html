<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Jadwal Dokter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; }
        .form-container { max-width: 500px; margin-top: 30px; }
        .btn-submit { background-color: #28a745; color: white; border: none; cursor: pointer; }
        .btn-submit:hover { background-color: #218838; }
        .btn-delete { background-color: #dc3545; color: white; border: none; cursor: pointer; }
        .btn-delete:hover { background-color: #c82333; }
        .nav-buttons {
            margin-top: 30px;
            max-width: 500px;
        }
        .nav-buttons a {
            display: block;
            text-align: center;
            background-color: #007bff;
            color: white;
            padding: 12px;
            margin-bottom: 10px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .nav-buttons a:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<h2>Daftar Jadwal Dokter</h2>
<table id="jadwalTable">
    <tr>
        <th>ID</th>
        <th>Hari</th>
        <th>Jam Masuk</th>
        <th>Jam Keluar</th>
        <th>Dokter</th>
        <th>Aksi</th>
    </tr>
</table>

<div class="form-container">
    <h3 id="form-title">Tambah Jadwal</h3>
    <select id="hari">
        <option value="">Pilih Hari</option>
        <option value="Senin">Senin</option>
        <option value="Selasa">Selasa</option>
        <option value="Rabu">Rabu</option>
        <option value="Kamis">Kamis</option>
        <option value="Jumat">Jumat</option>
        <option value="Sabtu">Sabtu</option>
        <option value="Minggu">Minggu</option>
    </select>
    <div id="hari-error" class="error-message"></div>
    
    <input type="time" id="jam_masuk" placeholder="Jam Masuk">
    <div id="jam_masuk-error" class="error-message"></div>
    
    <input type="time" id="jam_keluar" placeholder="Jam Keluar">
    <div id="jam_keluar-error" class="error-message"></div>
    
    <select id="id_dokter">
        <option value="">Pilih Dokter</option>
    </select>
    <div id="id_dokter-error" class="error-message"></div>
    
    <button class="btn-submit" onclick="tambahJadwal()">Kirim</button>
</div>

<div class="nav-buttons">
    <a href="staff.html">Halaman Staff</a>
    <a href="poli.html">Halaman Poli</a>
    <a href="home.html">Halaman Home</a>
</div>

<script>
    const API_URL = 'http://192.168.100.48:8000/api/jadwal';
const DOKTER_URL = 'http://192.168.100.48:8000/api/dokter';
    let jadwalEditId = null;

    window.onload = function () {
        fetchJadwal();
        fetchDokter();
    };

    function clearErrors() {
        document.querySelectorAll('.error-message').forEach(el => {
            el.textContent = '';
        });
    }

    function fetchDokter() {
        fetch(DOKTER_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Gagal mengambil data dokter');
                }
                return response.json();
            })
            .then(data => {
                const select = document.getElementById('id_dokter');
                select.innerHTML = '<option value="">Pilih Dokter</option>';
                data.forEach(dokter => {
                    const option = document.createElement('option');
                    option.value = dokter.id_dokter;
                    option.textContent = dokter.nama_dokter;
                    select.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Gagal mengambil data dokter:', error);
                alert('Gagal mengambil data dokter: ' + error.message);
            });
    }

    function fetchJadwal() {
        fetch(API_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const table = document.getElementById("jadwalTable");
                // Hapus semua baris kecuali header
                while (table.rows.length > 1) {
                    table.deleteRow(1);
                }
                
                data.forEach(jadwal => {
                    const row = table.insertRow();
                    row.innerHTML = `
                        <td>${jadwal.id_jadwal}</td>
                        <td>${jadwal.hari}</td>
                        <td>${jadwal.jam_masuk}</td>
                        <td>${jadwal.jam_keluar}</td>
                        <td>${jadwal.dokter ? jadwal.dokter.nama_dokter : '-'}</td>
                        <td>
                            <button onclick="isiFormEdit(${jadwal.id_jadwal}, '${jadwal.hari}', '${jadwal.jam_masuk}', '${jadwal.jam_keluar}', ${jadwal.id_dokter})">Edit</button>
                            <button class="btn-delete" onclick="hapusJadwal(${jadwal.id_jadwal})">Hapus</button>
                        </td>
                    `;
                });
            })
            .catch(error => {
                console.error('Gagal mengambil data jadwal:', error);
                alert('Gagal mengambil data jadwal: ' + error.message);
            });
    }

    function tambahJadwal() {
        clearErrors();
        
        const hari = document.getElementById('hari').value;
        const jam_masuk = document.getElementById('jam_masuk').value;
        const jam_keluar = document.getElementById('jam_keluar').value;
        const id_dokter = document.getElementById('id_dokter').value;

        // Validasi client-side
        let isValid = true;
        
        if (!hari) {
            document.getElementById('hari-error').textContent = 'Hari harus dipilih';
            isValid = false;
        }
        if (!jam_masuk) {
            document.getElementById('jam_masuk-error').textContent = 'Jam masuk harus diisi';
            isValid = false;
        }
        if (!jam_keluar) {
            document.getElementById('jam_keluar-error').textContent = 'Jam keluar harus diisi';
            isValid = false;
        }
        if (!id_dokter) {
            document.getElementById('id_dokter-error').textContent = 'Dokter harus dipilih';
            isValid = false;
        }
        
        if (!isValid) return;

        const data = { 
            hari, 
            jam_masuk, 
            jam_keluar, 
            id_dokter: parseInt(id_dokter)
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'Accept': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw err; });
            }
            return response.json();
        })
        .then(data => {
            alert('Jadwal berhasil ditambahkan');
            resetForm();
            fetchJadwal();
        })
        .catch(error => {
            console.error('Gagal:', error);
            
            // Tampilkan error validasi dari server jika ada
            if (error.errors) {
                for (const [field, messages] of Object.entries(error.errors)) {
                    const errorElement = document.getElementById(`${field}-error`);
                    if (errorElement) {
                        errorElement.textContent = messages.join(', ');
                    }
                }
            } else {
                alert('Gagal menambahkan jadwal: ' + (error.message || JSON.stringify(error)));
            }
        });
    }

    function isiFormEdit(id, hari, jam_masuk, jam_keluar, id_dokter) {
        clearErrors();
        
        document.getElementById('hari').value = hari;
        document.getElementById('jam_masuk').value = jam_masuk;
        document.getElementById('jam_keluar').value = jam_keluar;
        document.getElementById('id_dokter').value = id_dokter;
        jadwalEditId = id;

        document.getElementById('form-title').innerText = 'Edit Jadwal';
        const tombol = document.querySelector('.btn-submit');
        tombol.innerText = 'Update Jadwal';
        tombol.onclick = updateJadwal;
    }

    function updateJadwal() {
        clearErrors();
        
        const hari = document.getElementById('hari').value;
        const jam_masuk = document.getElementById('jam_masuk').value;
        const jam_keluar = document.getElementById('jam_keluar').value;
        const id_dokter = document.getElementById('id_dokter').value;

        // Validasi client-side
        let isValid = true;
        
        if (!hari) {
            document.getElementById('hari-error').textContent = 'Hari harus dipilih';
            isValid = false;
        }
        if (!jam_masuk) {
            document.getElementById('jam_masuk-error').textContent = 'Jam masuk harus diisi';
            isValid = false;
        }
        if (!jam_keluar) {
            document.getElementById('jam_keluar-error').textContent = 'Jam keluar harus diisi';
            isValid = false;
        }
        if (!id_dokter) {
            document.getElementById('id_dokter-error').textContent = 'Dokter harus dipilih';
            isValid = false;
        }
        
        if (!isValid) return;

        const data = { 
            hari, 
            jam_masuk, 
            jam_keluar, 
            id_dokter: parseInt(id_dokter)
        };

        fetch(`${API_URL}/${jadwalEditId}`, {
            method: 'PUT',
            headers: { 
                'Content-Type': 'application/json', 
                'Accept': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw err; });
            }
            return response.json();
        })
        .then(data => {
            alert('Jadwal berhasil diperbarui');
            resetForm();
            fetchJadwal();
        })
        .catch(error => {
            console.error('Error:', error);
            
            // Tampilkan error validasi dari server jika ada
            if (error.errors) {
                for (const [field, messages] of Object.entries(error.errors)) {
                    const errorElement = document.getElementById(`${field}-error`);
                    if (errorElement) {
                        errorElement.textContent = messages.join(', ');
                    }
                }
            } else {
                alert('Error: ' + (error.message || JSON.stringify(error)));
            }
        });
    }

    function hapusJadwal(id) {
    if (!confirm('Apakah Anda yakin ingin menghapus jadwal ini?')) return;

    fetch(`${API_URL}/${id}`, {
        method: 'DELETE',
        headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token') // Jika menggunakan auth
        }
    })
    .then(async (response) => {
        if (response.status === 204) {
            return { success: true }; // Untuk response no content
        }
        
        const data = await response.json();
        
        if (!response.ok) {
            throw data || new Error('Gagal menghapus jadwal');
        }
        
        return data;
    })
    .then(() => {
        alert('Jadwal berhasil dihapus');
        fetchJadwal();
    })
    .catch(error => {
        console.error('Error saat hapus:', error);
        const errorMsg = error.message || 
                        error.error?.message || 
                        'Terjadi kesalahan saat menghapus jadwal';
        alert('Gagal menghapus jadwal: ' + errorMsg);
    });
}

    function resetForm() {
        document.getElementById('hari').value = '';
        document.getElementById('jam_masuk').value = '';
        document.getElementById('jam_keluar').value = '';
        document.getElementById('id_dokter').value = '';
        jadwalEditId = null;
        document.getElementById('form-title').innerText = 'Tambah Jadwal';
        const tombol = document.querySelector('.btn-submit');
        tombol.innerText = 'Kirim';
        tombol.onclick = tambahJadwal;
        clearErrors();
    }
</script>

</body>
</html>
