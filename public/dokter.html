<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <title>Data Dokter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; }
        .form-container { max-width: 400px; margin-top: 30px; }
        .btn-submit { background-color: #28a745; color: white; border: none; cursor: pointer; }
        .btn-submit:hover { background-color: #218838; }
        .btn-delete { background-color: #dc3545; color: white; border: none; cursor: pointer; }
        .btn-delete:hover { background-color: #c82333; }
    </style>
</head>
<body>

<h2>Daftar Dokter</h2>
<table id="dokterTable">
    <tr>
        <th>ID</th>
        <th>Nama Dokter</th>
        <th>Spesialis</th>
        <th>Kontak</th>
        <th>Email</th>
        <th>Aksi</th>
    </tr>
</table>

<div class="form-container">
    <h3 id="form-title">Tambah Dokter</h3>
    <input type="text" id="nama_dokter" placeholder="Nama Dokter" />
    <input type="text" id="spesialis" placeholder="Spesialis" />
    <input type="text" id="nomor_kontak" placeholder="Nomor Kontak" />
    <input type="email" id="email" placeholder="Email" />
    <button class="btn-submit" onclick="tambahDokter()">Kirim</button>
</div>

<script>
    const API_URL = 'http://192.168.100.48:8000/api/dokter';
    let dokterEditId = null;

    window.onload = function () {
        fetchDokter();
    };

    function fetchDokter() {
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                const table = document.getElementById("dokterTable");
                table.innerHTML = `
                    <tr>
                        <th>ID</th>
                        <th>Nama Dokter</th>
                        <th>Spesialis</th>
                        <th>Kontak</th>
                        <th>Email</th>
                        <th>Aksi</th>
                    </tr>
                `;
                data.forEach(dokter => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${dokter.id_dokter}</td>
                        <td>${dokter.nama_dokter}</td>
                        <td>${dokter.spesialis}</td>
                        <td>${dokter.nomor_kontak}</td>
                        <td>${dokter.email}</td>
                        <td>
                            <button onclick="isiFormEdit(${dokter.id_dokter}, '${dokter.nama_dokter}', '${dokter.spesialis}', '${dokter.nomor_kontak}', '${dokter.email}')">Edit</button>
                            <button class="btn-delete" onclick="hapusDokter(${dokter.id_dokter})">Hapus</button>
                        </td>
                    `;
                    table.appendChild(row);
                });
            })
            .catch(error => console.error('Gagal mengambil data dokter:', error));
    }

    function resetForm() {
        document.getElementById('nama_dokter').value = '';
        document.getElementById('spesialis').value = '';
        document.getElementById('nomor_kontak').value = '';
        document.getElementById('email').value = '';
        dokterEditId = null;
        document.getElementById('form-title').innerText = 'Tambah Dokter';
        const tombol = document.querySelector('.btn-submit');
        tombol.innerText = 'Kirim';
        tombol.onclick = tambahDokter;
    }

    function tambahDokter() {
        const nama = document.getElementById('nama_dokter').value.trim();
        const spesialis = document.getElementById('spesialis').value.trim();
        const kontak = document.getElementById('nomor_kontak').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!nama || !spesialis || !kontak || !email) {
            alert('Semua field harus diisi!');
            return;
        }

        const data = {
            nama_dokter: nama,
            spesialis: spesialis,
            nomor_kontak: kontak,
            email: email
        };

        fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok) {
                alert('Dokter berhasil ditambahkan');
                resetForm();
                fetchDokter();
            } else {
                alert('Gagal menambahkan dokter');
            }
        })
        .catch(error => {
            console.error('Gagal:', error);
        });
    }

    function isiFormEdit(id, nama, spesialis, kontak, email) {
        document.getElementById('nama_dokter').value = nama;
        document.getElementById('spesialis').value = spesialis;
        document.getElementById('nomor_kontak').value = kontak;
        document.getElementById('email').value = email;

        dokterEditId = id;

        document.getElementById('form-title').innerText = 'Edit Dokter';
        const tombol = document.querySelector('.btn-submit');
        tombol.innerText = 'Update Dokter';
        tombol.onclick = updateDokter;
    }

    function updateDokter() {
        const nama = document.getElementById('nama_dokter').value.trim();
        const spesialis = document.getElementById('spesialis').value.trim();
        const kontak = document.getElementById('nomor_kontak').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!nama || !spesialis || !kontak || !email) {
            alert('Semua field harus diisi!');
            return;
        }

        const data = {
            nama_dokter: nama,
            spesialis: spesialis,
            nomor_kontak: kontak,
            email: email
        };

        fetch(`${API_URL}/${dokterEditId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok) {
                alert('Dokter berhasil diperbarui');
                resetForm();
                fetchDokter();
            } else {
                return response.json().then(err => { throw new Error(err.message || 'Gagal update'); });
            }
        })
        .catch(error => {
            console.error('Error saat update:', error);
            alert('Error: ' + error.message);
        });
    }

    function hapusDokter(id) {
        if (!confirm("Yakin ingin menghapus dokter ini?")) return;

        fetch(`${API_URL}/${id}`, {
            method: 'DELETE',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                alert('Dokter berhasil dihapus');
                fetchDokter();
            } else {
                alert('Gagal menghapus dokter');
            }
        })
        .catch(error => {
            console.error('Gagal menghapus:', error);
            alert('Terjadi kesalahan saat menghapus data');
        });
    }
</script>

</body>
</html>
